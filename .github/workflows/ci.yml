# CI de Lecto (repo público): pruebas del servidor + build de la imagen.
# No publica nada (ver release.yml para publicar a GHCR al tagear).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # (a) Pruebas del servidor (Python, sin contenedor).
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Pillow (unica dependencia del servidor)
        run: pip install Pillow
      - name: Pruebas
        run: python3 -m unittest discover -s tests -t . -v

  # (b) Build de la imagen + smoke test.
  image-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build de la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: false
          tags: lecto-server:ci
          load: true
      - name: Smoke test — el contenedor arranca y responde /api/info
        run: |
          docker run -d --name smoke -p 8790:8790 lecto-server:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8790/api/info > /dev/null; then
              echo "Servidor arrancó"
              exit 0
            fi
            sleep 1
          done
          echo "El servidor no arrancó a tiempo" >&2
          docker logs smoke
          exit 1
      - name: Limpieza
        if: always()
        run: docker rm -f smoke 2>/dev/null || true
